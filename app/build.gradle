plugins {
    alias(libs.plugins.screenshot)
    alias(libs.plugins.android)
    alias(libs.plugins.compose)
    alias(libs.plugins.serialization)
    alias(libs.plugins.ksp)
    alias(libs.plugins.google.services)
    alias(libs.plugins.hilt)
}
ksp { arg('room.schemaLocation', "$projectDir/schemas") }
def uploadSigning = ['QUOTER_UPLOAD_STORE', 'QUOTER_UPLOAD_ALIAS',
                     'QUOTER_UPLOAD_STORE_PASSWORD', 'QUOTER_UPLOAD_KEY_PASSWORD']
        .collectEntries { [(it): System.getenv(it)] }
def hasUploadSigning = uploadSigning.values().every { it }
if (uploadSigning.values().any { it } && !hasUploadSigning) {
    throw new GradleException('Supply all four QUOTER_UPLOAD_* environment variables for signing.')
}
android {
    experimentalProperties['android.experimental.enableScreenshotTest'] = true
    namespace 'com.dayaonweb.quoter'
    compileSdk 37
    defaultConfig {
        applicationId 'com.dayaonweb.quoter'
        minSdk 24
        targetSdk 37
        versionCode 40000
        versionName '4.00.00'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        if (hasUploadSigning) {
            upload {
                storeFile file(uploadSigning.QUOTER_UPLOAD_STORE)
                keyAlias uploadSigning.QUOTER_UPLOAD_ALIAS
                storePassword uploadSigning.QUOTER_UPLOAD_STORE_PASSWORD
                keyPassword uploadSigning.QUOTER_UPLOAD_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            if (hasUploadSigning) signingConfig signingConfigs.upload
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug { minifyEnabled false; shrinkResources false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { compose true; buildConfig true }
}
dependencies {
    implementation libs.play.review
    implementation libs.compose.animation.graphics
    screenshotTestImplementation libs.screenshot.validation
    screenshotTestImplementation platform(libs.compose.bom)
    screenshotTestImplementation libs.compose.tooling
    implementation libs.core
    implementation libs.splashscreen
    implementation platform(libs.compose.bom)
    implementation libs.compose.material3
    implementation libs.backdrop
    implementation libs.compose.foundation
    implementation libs.compose.preview
    implementation libs.activity.compose
    implementation libs.lifecycle.compose
    implementation libs.lifecycle.viewmodel
    implementation libs.navigation3.ui
    implementation libs.adaptive.navigation3
    implementation libs.room.runtime
    implementation libs.datastore
    implementation libs.okhttp
    implementation libs.hilt
    ksp libs.hilt.compiler
    ksp libs.room.compiler
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.analytics
    debugImplementation libs.compose.tooling
    debugImplementation libs.compose.test.manifest
    testImplementation libs.junit
    androidTestImplementation libs.android.junit
    androidTestImplementation libs.espresso
    androidTestImplementation platform(libs.compose.bom)
    androidTestImplementation libs.compose.test
    androidTestImplementation libs.window.testing
    androidTestImplementation libs.uiautomator
}
