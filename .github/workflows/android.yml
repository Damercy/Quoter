name: Android verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - run: chmod +x gradlew
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:bundleRelease
      - run: ./gradlew :app:validateDebugScreenshotTest
      - run: node scripts/check-native-alignment.mjs app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: build-reports-and-unsigned-bundle
          path: |
            app/build/reports/
            app/build/outputs/bundle/release/
            app/build/outputs/mapping/release/
  devices:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: '24'
            profile: pixel
          - api: '37.0'
            profile: pixel_fold
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - run: chmod +x gradlew
      - uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: device-reports-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
