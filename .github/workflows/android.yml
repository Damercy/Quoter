name: Android verification
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  CI: 'true'
  GRADLE_OPTS: -Dorg.gradle.daemon=false
jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      android: ${{ steps.paths.outputs.android }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: paths
        name: Classify changed paths
        run: python3 scripts/ci-changes.py
      - name: Validate workflow syntax and shell commands
        run: |
          curl -fsSL --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Test publishing guards and CI routing
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify generated gallery and store asset inventory
        run: |
          node scripts/frame-store-gallery.mjs
          python3 scripts/sync-store-gallery.py
          git diff --exit-code -- README.md screenshots/frames play-store/store-update.json play-store/screenshots/inventory.json
      - name: Reject tracked signing credentials
        run: |
          if git ls-files | grep -Ei '\.(jks|keystore|p12|pfx|clixml)$|(^|/)(publisher\.json|keystore\.properties)$'; then
            echo "::error::Private publishing credentials must not be tracked."
            exit 1
          fi
  build:
    name: Build, lint and previews
    needs: checks
    if: needs.checks.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - run: chmod +x gradlew
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:bundleRelease
      - run: ./gradlew :app:validateDebugScreenshotTest
      - run: node scripts/check-native-alignment.mjs app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: build-reports
          retention-days: 7
          if-no-files-found: ignore
          path: |
            app/build/reports/
  devices:
    name: Device tests (API ${{ matrix.api }}, ${{ matrix.window }})
    needs: [checks, build]
    if: needs.checks.outputs.android == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - api: '24'
            window: phone
            size: 1080x1920
            density: 420
          - api: '37.0'
            window: wide
            size: 1600x2000
            density: 240
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: true
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: chmod +x gradlew
      - uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          # Wide-window tests publish synthetic separating hinges; this is not hardware fold validation.
          script: |
            adb shell wm size ${{ matrix.size }}
            adb shell wm density ${{ matrix.density }}
            ./gradlew :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: device-reports-${{ matrix.api }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
